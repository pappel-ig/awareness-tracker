[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
lettre = "0.11.23"
dotenvy = "0.15.7"
axum = "0.8.9"
rustls = "0.23.43"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto", "service"] }
tower = "0.5.3"
rustls-pemfile = "2.2.0"
serde_json = "1.0.151"
rcgen = "0.14.9"
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
email_address = "0.2.9"
log = "0.4.34"
